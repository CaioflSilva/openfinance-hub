spring:
  application:
    name: openfinance-hub

  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/openfinance
    username: postgres
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: ${RABBITMQ_PASSWORD:guest}

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:fallback-only-for-tests-do-not-use-in-prod}
    expiration: ${JWT_EXPIRATION:86400000}

springdoc:
  api-docs:
  swagger-ui:
    path: /swagger-ui.html

openfinance:
  rabbitmq:
    queues:
      transactions: transactions.queue
      pix: pix.queue
      alerts: alerts.queue
    exchanges:
      transactions: transactions.exchange
      pix: pix.exchange